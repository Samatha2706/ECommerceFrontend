name: Frontend CI and CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy to Kind
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          podman build -t localhost/ecommerce-frontend:${{ github.sha }} -f Containerfile .

      - name: Import image into Kind
        run: |
          podman save --format docker-archive -o frontend.tar localhost/ecommerce-frontend:${{ github.sha }}
          podman cp frontend.tar ecommerce-podman-control-plane:/tmp/frontend.tar
          podman exec ecommerce-podman-control-plane ctr -n k8s.io images import /tmp/frontend.tar
          podman exec ecommerce-podman-control-plane rm -f /tmp/frontend.tar
          rm -f frontend.tar

      - name: Update Kubernetes deployment
        run: |
          kubectl --context kind-ecommerce-podman set image deployment/ecommerce-frontend ecommerce-frontend=localhost/ecommerce-frontend:${{ github.sha }}
          kubectl --context kind-ecommerce-podman rollout status deployment/ecommerce-frontend --timeout=180s

      - name: Verify deployment
        run: |
          kubectl --context kind-ecommerce-podman get deployment ecommerce-frontend
